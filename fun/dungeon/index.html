<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sixdog — 地牢探险</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
  canvas { max-width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="page wide">
    <div class="crumb"><a href="../index.html">~/fun</a> dungeon</div>
    <h1 class="title">$ dungeon</h1>
    <div style="text-align: center">
      <canvas id="game"></canvas>
      <div class="game-desc" style="margin-top: 16px">方向键移动 · A 普通攻击 · S 拾取 · 踩上楼梯下行 · 结束后回车重开</div>
    </div>
  </div>
  <div class="footer">© 2026 小拳头</div>
<script>
'use strict';

// ==================== 游戏核心（纯逻辑，node 可测） ====================
const MAP_W = 56, MAP_H = 32;   // 每层 56×32 格
const FLOORS = 5;               // 一局 5 层
const FOV_RADIUS = 8;           // 视野半径
const XP_TABLE = [10, 25, 45, 70, 100]; // 升级所需累计 XP

// 武器：唯一装备槽，三系各三档，层数越深掉落档位越高
const WEAPONS = {
  melee:  { label: '近战', names: ['短剑', '长剑', '巨剑'],         dmg: [8, 12, 17] },
  archer: { label: '射手', names: ['短弓', '长弓', '强弩'],         dmg: [6, 9, 13] },
  staff:  { label: '法杖', names: ['学徒法杖', '术士法杖', '秘法法杖'], dmg: [5, 8, 11] },
};
// 怪物模板：三档普通怪 + 远程弓手 + 小狗 + 三个 Boss
const MONSTER_TYPES = {
  slime:    { name: '史莱姆', hp: 12, atk: 3,  xp: 3,  speed: 2, glyph: 's', drops: true },  // 弱，一回合移动 2 格
  skeleton: { name: '骷髅',   hp: 20, atk: 5,  xp: 5,  speed: 1, glyph: 'k', drops: true, poison: { turns: 3, dmg: 2 } }, // 中，攻击附加中毒
  orc:      { name: '兽人',   hp: 35, atk: 8,  xp: 8,  speed: 1, glyph: 'o', drops: true },  // 强，血厚攻高
  skeleton_archer: { name: '骷髅弓手', hp: 16, atk: 4, xp: 4, speed: 1, glyph: 'a', drops: true, ranged: { min: 2, max: 7 } }, // 远程：视线内射箭
  puppy:    { name: '小狗',   hp: 8,  atk: 2,  xp: 1,  speed: 1, glyph: 'd' },               // 汪汪召唤物，史莱姆级弱怪
  meow:     { name: '喵喵',   hp: 40, atk: 6,  xp: 25, speed: 1, glyph: 'M', lives: 9 },     // 第 3 层 Boss，9 条命
  woof:     { name: '汪汪',   hp: 80, atk: 10, xp: 25, speed: 1, glyph: 'W' },               // 第 3 层 Boss，召唤狗群
  mirror:   { name: '镜像',   hp: 1,  atk: 1,  xp: 50, speed: 1, glyph: 'X' },               // 第 5 层 Boss，数值生成时复制玩家后覆盖
};
const SKILL_NAMES = { power: '力量', tough: '坚韧', cleave: '顺劈', pierce: '穿透', empower: '元素强化' };
const CLASS_SKILL = { melee: 'cleave', archer: 'pierce', staff: 'empower' }; // 武器专属技能
const MAX_PUPPIES = 4;    // 场上存活小狗上限
const SUMMON_EVERY = 4;   // 汪汪每隔 4 回合召唤一次
const HEAL_AMOUNT = 15;   // 血包回复量

// 确定性伪随机数（mulberry32），相同种子生成相同地牢
function mulberry32(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function createGame({ seed, rng } = {}) {
  const g = {
    seed,
    rng: rng || mulberry32(seed === undefined ? (Math.random() * 2 ** 31) | 0 : seed),
    status: 'playing', // playing / won / lost
    turns: 0,
    floor: 1,
    map: new Array(MAP_W * MAP_H).fill(0), // 0 墙 1 地
    rooms: [],
    visible: new Array(MAP_W * MAP_H).fill(false),
    memory: new Array(MAP_W * MAP_H).fill(false),
    player: {
      r: 0, c: 0, hp: 40, maxHp: 40, baseAtk: 5,
      weapon: { class: 'melee', tier: 1, name: WEAPONS.melee.names[0] }, // 初始 1 档近战
      skills: { power: 0, tough: 0, cleave: 0, pierce: 0, empower: 0 },
      xp: 0, level: 1,
      form: 'fire',        // 法杖下一发形态：fire 火焰 / frost 冰霜
      poisonTurns: 0, poisonDmg: 0,
      dir: { dr: 1, dc: 0 }, // 朝向（空击动画方向），默认朝下
    },
    monsters: [],
    items: [],
    stairs: null,
    nextId: 1,
    log: [],
    fx: [], // 攻击/受击事件队列，供渲染层消费做动画（逻辑层只写不读）
  };
  generateFloor(g, 1);
  return g;
}

function say(g, msg) {
  g.log.push(msg);
  if (g.log.length > 60) g.log.shift();
}

// ---------- 地图生成：房间 + 走廊 ----------
function generateMap(rng) {
  const map = new Array(MAP_W * MAP_H).fill(0);
  const rooms = [];
  let attempts = 0;
  while (rooms.length < 12 && attempts < 400) {
    attempts++;
    const w = 4 + Math.floor(rng() * 6);
    const h = 3 + Math.floor(rng() * 4);
    const c = 1 + Math.floor(rng() * (MAP_W - w - 2));
    const r = 1 + Math.floor(rng() * (MAP_H - h - 2));
    const overlaps = rooms.some(o =>
      c < o.c + o.w + 1 && o.c < c + w + 1 && r < o.r + o.h + 1 && o.r < r + h + 1);
    if (overlaps) continue;
    for (let rr = r; rr < r + h; rr++) for (let cc = c; cc < c + w; cc++) map[rr * MAP_W + cc] = 1;
    rooms.push({ r, c, w, h, cr: r + (h >> 1), cc: c + (w >> 1) });
  }
  // 顺序连接相邻房间中心，L 形走廊，方向先后随机
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    if (rng() < 0.5) { hCorridor(map, a.cc, b.cc, a.cr); vCorridor(map, a.cr, b.cr, b.cc); }
    else { vCorridor(map, a.cr, b.cr, a.cc); hCorridor(map, a.cc, b.cc, b.cr); }
  }
  return { map, rooms };
}
function hCorridor(map, c1, c2, r) {
  for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) map[r * MAP_W + c] = 1;
}
function vCorridor(map, r1, r2, c) {
  for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) map[r * MAP_W + c] = 1;
}

// ---------- 层生成 ----------
function addMonster(g, type, r, c) {
  const t = MONSTER_TYPES[type];
  const m = {
    id: g.nextId++, type, name: t.name, r, c,
    hp: t.hp, maxHp: t.hp, atk: t.atk, xp: t.xp, speed: t.speed, glyph: t.glyph,
    alive: true, aware: false,
    effects: { burnTurns: 0, burnDmg: 0, slow: 0 },
    slowPhase: false,       // 减速时隔回合行动的相位
    invincibleTurns: 0,     // 喵喵复活当回合无敌
  };
  if (t.lives) m.lives = t.lives;
  if (t.poison) m.poison = t.poison;
  if (t.ranged) m.ranged = t.ranged; // 只读射程配置，共享模板引用
  if (type === 'woof') m.summonCd = SUMMON_EVERY;
  g.monsters.push(m);
  return m;
}

function generateFloor(g, n) {
  if (n === 3 || n === 5) return generateArena(g, n); // Boss 层：整层竞技场
  g.floor = n;
  const { map, rooms } = generateMap(g.rng);
  g.map = map;
  g.rooms = rooms;
  g.monsters = [];
  g.items = [];
  g.stairs = null;
  g.fx.length = 0; // 跨层清掉残留的攻击事件
  g.memory.fill(false);
  const p = g.player;
  p.r = rooms[0].cr; p.c = rooms[0].cc;
  p.poisonTurns = 0;

  // 普通层（1/2/4）：楼梯放在最后一个房间，怪物散布其余房间
  const last = rooms[rooms.length - 1];
  g.stairs = { r: last.cr, c: last.cc };
  for (let i = 1; i < rooms.length; i++) {
    const room = rooms[i];
    const count = 1 + (g.rng() < 0.4 ? 1 : 0);
    for (let k = 0; k < count; k++) {
      let r, c, tries = 0;
      do {
        r = room.r + Math.floor(g.rng() * room.h);
        c = room.c + Math.floor(g.rng() * room.w);
        tries++;
      } while (tries < 10 && (monsterAt(g, r, c) || (g.stairs.r === r && g.stairs.c === c)));
      if (monsterAt(g, r, c)) continue;
      let type = 'slime';
      if (n === 2) {
        const roll = g.rng();
        type = roll < 0.4 ? 'slime' : roll < 0.7 ? 'skeleton' : 'skeleton_archer';
      } else if (n === 4) {
        const roll = g.rng();
        type = roll < 0.4 ? 'skeleton' : roll < 0.7 ? 'orc' : 'skeleton_archer';
      }
      addMonster(g, type, r, c);
    }
  }
  say(g, `你来到了地牢第 ${n} 层`);
  computeFov(g);
}

// Boss 竞技场（第 3、5 层）：整层一个居中房间，玩家在入口，Boss 在房间中远处，
// 尺寸保证玩家进场即在 FOV 内看到 Boss（第 2、4 层楼梯强制进入）
function generateArena(g, n) {
  g.floor = n;
  const w = 18, h = 10;
  const r0 = Math.floor((MAP_H - h) / 2), c0 = Math.floor((MAP_W - w) / 2);
  g.map = new Array(MAP_W * MAP_H).fill(0);
  for (let r = r0; r < r0 + h; r++) for (let c = c0; c < c0 + w; c++) g.map[r * MAP_W + c] = 1;
  g.rooms = [{ r: r0, c: c0, w, h, cr: r0 + (h >> 1), cc: c0 + (w >> 1) }];
  g.monsters = [];
  g.items = [];
  g.stairs = null;
  g.fx.length = 0;
  g.memory.fill(false);
  const p = g.player;
  p.r = r0 + h - 2; p.c = c0 + (w >> 1); // 入口：房间下缘中央
  p.poisonTurns = 0;
  if (n === 3) {
    // 双 Boss：喵喵 + 汪汪分置房间上缘两侧
    addMonster(g, 'meow', r0 + 2, c0 + 5);
    addMonster(g, 'woof', r0 + 2, c0 + w - 6);
  } else {
    // 最终 Boss（镜像）：复制玩家当前武器系与技能，数值 1.5 倍
    const m = addMonster(g, 'mirror', r0 + 2, c0 + (w >> 1));
    m.weapon = { ...p.weapon };
    m.skills = { ...p.skills };
    m.maxHp = m.hp = Math.round(p.maxHp * 1.5);
    m.atk = Math.max(1, Math.round(playerAttack(g) * 1.5));
    if (m.weapon.class !== 'melee') {
      m.ranged = { min: 2, max: 7 }; // 复制射手/法杖时以远程方式攻击
      m.form = 'fire';
    }
  }
  say(g, `你来到了地牢第 ${n} 层——Boss 的房间！`);
  computeFov(g);
}

// ---------- 查询 ----------
function monsterAt(g, r, c) {
  return g.monsters.find(m => m.alive && m.r === r && m.c === c) || null;
}
function itemAt(g, r, c) {
  return g.items.find(it => it.r === r && it.c === c) || null;
}
function weaponDamage(w) {
  return WEAPONS[w.class].dmg[w.tier - 1];
}
// 玩家攻击力 = 武器伤害 + 基础攻击 + 力量加成（每层 +3）
function playerAttack(g) {
  const p = g.player;
  return weaponDamage(p.weapon) + p.baseAtk + 3 * p.skills.power;
}
function dist2(a, b) {
  return (a.r - b.r) ** 2 + (a.c - b.c) ** 2;
}

// ---------- 视野（FOV）：半径 8，直线插值检查墙体遮挡 ----------
function losClear(g, r0, c0, r1, c1) {
  const steps = Math.max(Math.abs(r1 - r0), Math.abs(c1 - c0)) * 2;
  if (steps === 0) return true;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const r = Math.round(r0 + (r1 - r0) * t);
    const c = Math.round(c0 + (c1 - c0) * t);
    if ((r === r0 && c === c0) || (r === r1 && c === c1)) continue;
    if (g.map[r * MAP_W + c] === 0) return false;
  }
  return true;
}
function computeFov(g) {
  g.visible.fill(false);
  const p = g.player, R = FOV_RADIUS;
  for (let r = Math.max(0, p.r - R); r <= Math.min(MAP_H - 1, p.r + R); r++) {
    for (let c = Math.max(0, p.c - R); c <= Math.min(MAP_W - 1, p.c + R); c++) {
      if ((r - p.r) ** 2 + (c - p.c) ** 2 > R * R) continue;
      if (losClear(g, p.r, p.c, r, c)) {
        const i = r * MAP_W + c;
        g.visible[i] = true;
        g.memory[i] = true; // 看过的格子进入记忆
      }
    }
  }
}

// ---------- 寻路（BFS）：绕开障碍追击 ----------
// 返回从 (sr,sc) 到 (tr,tc) 的步骤数组（不含起点），不可达返回 null
function findPath(g, sr, sc, tr, tc) {
  if (sr === tr && sc === tc) return [];
  const start = sr * MAP_W + sc, target = tr * MAP_W + tc;
  const prev = new Int32Array(MAP_W * MAP_H).fill(-1);
  prev[start] = start;
  const queue = [start];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let head = 0; head < queue.length; head++) {
    const cur = queue[head];
    if (cur === target) break;
    const cr = Math.floor(cur / MAP_W), cc = cur % MAP_W;
    for (const [dr, dc] of DIRS) {
      const nr = cr + dr, nc = cc + dc;
      if (nr < 0 || nr >= MAP_H || nc < 0 || nc >= MAP_W) continue;
      const ni = nr * MAP_W + nc;
      if (prev[ni] !== -1) continue;
      if (g.map[ni] !== 1 && ni !== target) continue;
      prev[ni] = cur;
      queue.push(ni);
    }
  }
  if (prev[target] === -1) return null;
  const path = [];
  let cur = target;
  while (cur !== start) {
    path.push({ r: Math.floor(cur / MAP_W), c: cur % MAP_W });
    cur = prev[cur];
  }
  path.reverse();
  return path;
}

// ---------- 伤害与击杀 ----------
function damagePlayer(g, dmg, source) {
  const p = g.player;
  p.hp -= dmg;
  g.fx.push({ kind: 'hit', r: p.r, c: p.c, dmg }); // 玩家受击红闪
  if (p.hp <= 0) {
    p.hp = 0;
    g.status = 'lost';
    say(g, `你被${source}杀死了……`);
  }
}

function damageMonster(g, m, dmg, source) {
  if (!m.alive) return;
  if (m.invincibleTurns > 0) {
    say(g, `${m.name}刚刚复活，免疫了这次伤害`);
    return;
  }
  m.hp -= dmg;
  m.aware = true; // 被打过即发现玩家
  g.fx.push({ kind: 'hit', r: m.r, c: m.c, dmg });
  if (m.hp <= 0) killMonster(g, m);
}

function killMonster(g, m) {
  // 喵喵 9 条命：命数未尽则原地复活，复活当回合无敌
  if (m.type === 'meow' && m.lives > 1) {
    m.lives--;
    m.hp = m.maxHp;
    m.invincibleTurns = 1;
    say(g, `喵喵原地复活了！还剩 ${m.lives} 条命`);
    return;
  }
  m.alive = false;
  say(g, `你击杀了${m.name}，获得 ${m.xp} 点经验`);
  gainXp(g, m.xp);
  rollDrops(g, m);
  if (g.floor === 3) checkFloor3Stairs(g);
  if (g.floor === 5 && m.type === 'mirror') {
    g.status = 'won';
    say(g, '你击败了镜像，通关了这座地牢！');
  }
}

function gainXp(g, amount) {
  const p = g.player;
  p.xp += amount;
  while (p.level <= XP_TABLE.length && p.xp >= XP_TABLE[p.level - 1]) {
    p.level++;
    p.baseAtk += 2;
    p.maxHp += 6;
    p.hp += 6;
    say(g, `你升到了 ${p.level} 级！攻击 +2，生命上限 +6`);
  }
}

// 击杀掉落：武器 / 血包 / 技能书（Boss 不掉落）
function rollDrops(g, m) {
  if (!MONSTER_TYPES[m.type].drops) return;
  const roll = g.rng();
  if (roll < 0.18) {
    const classes = Object.keys(WEAPONS);
    const cls = classes[Math.floor(g.rng() * classes.length)];
    const tier = Math.min(3, Math.ceil(g.floor / 2)); // 层数越深档位越高
    g.items.push({ kind: 'weapon', r: m.r, c: m.c, weapon: { class: cls, tier, name: WEAPONS[cls].names[tier - 1] } });
    say(g, `${m.name}掉落了${WEAPONS[cls].names[tier - 1]}`);
  } else if (roll < 0.38) {
    g.items.push({ kind: 'health', r: m.r, c: m.c, amount: HEAL_AMOUNT });
    say(g, `${m.name}掉落了血包`);
  } else if (roll < 0.53) {
    const pool = ['power', 'tough', CLASS_SKILL[g.player.weapon.class]];
    const skill = pool[Math.floor(g.rng() * pool.length)];
    g.items.push({ kind: 'skill', r: m.r, c: m.c, skill });
    say(g, `${m.name}掉落了技能书「${SKILL_NAMES[skill]}」`);
  }
}

// 第 3 层双 Boss 全灭后出现楼梯
function checkFloor3Stairs(g) {
  if (g.floor !== 3 || g.stairs) return;
  const bossAlive = g.monsters.some(m => m.alive && (m.type === 'meow' || m.type === 'woof'));
  if (!bossAlive) {
    const room = g.rooms[g.rooms.length - 1];
    g.stairs = { r: room.cr, c: room.cc };
    say(g, '双 Boss 已被消灭，通往下一层的楼梯出现了！');
  }
}

// ---------- 玩家动作 ----------
// 移动：8 方向；撞墙/撞怪都原地不动（不耗回合）；(0,0) = 等待；攻击只走 A 键 autoAttack
function move(g, dr, dc) {
  if (g.status !== 'playing') return g;
  dr = Math.sign(dr); dc = Math.sign(dc);
  if (dr === 0 && dc === 0) return wait(g);
  const p = g.player;
  p.dir = { dr, dc }; // 更新朝向（供空击动画）
  const nr = p.r + dr, nc = p.c + dc;
  if (nr < 0 || nr >= MAP_H || nc < 0 || nc >= MAP_W) return g;
  if (g.map[nr * MAP_W + nc] === 0) return g; // 撞墙不动
  const m = monsterAt(g, nr, nc);
  if (m) { // 撞怪只被挡住，不造成伤害、不耗回合
    say(g, `${m.name}挡住了去路`);
    return g;
  }
  p.r = nr; p.c = nc; // 落脚不自动拾取，道具需按 S 拾取
  worldTick(g);
  return g;
}

function wait(g) {
  if (g.status !== 'playing') return g;
  worldTick(g);
  return g;
}

// bump 命中结算：A 键近战命中相邻怪物；顺劈波及目标周围其他相邻怪
function bumpHit(g, m) {
  const p = g.player;
  const dmg = playerAttack(g);
  say(g, `你击中了${m.name}（${dmg} 点伤害）`);
  g.fx.push({ kind: 'melee', from: { r: p.r, c: p.c }, to: { r: m.r, c: m.c } });
  damageMonster(g, m, dmg, 'attack');
  // 顺劈：近战 bump 命中时波及目标周围其他相邻怪
  if (p.weapon.class === 'melee' && p.skills.cleave > 0) {
    for (const other of g.monsters) {
      if (!other.alive || other === m) continue;
      if (Math.abs(other.r - m.r) <= 1 && Math.abs(other.c - m.c) <= 1) {
        say(g, `顺劈波及了${other.name}（${dmg} 点伤害）`);
        g.fx.push({ kind: 'melee', from: { r: p.r, c: p.c }, to: { r: other.r, c: other.c } });
        damageMonster(g, other, dmg, 'cleave');
      }
    }
  }
}

// ---------- 自动锁定（A 普通攻击） ----------
// 近战候选：相邻 8 格中 HP 最低的怪物（并列取先遇到的）
function meleeTarget(g) {
  const p = g.player;
  let best = null;
  for (const m of g.monsters) {
    if (!m.alive) continue;
    if (Math.abs(m.r - p.r) > 1 || Math.abs(m.c - p.c) > 1) continue;
    if (!best || m.hp < best.hp) best = m;
  }
  return best;
}

// 远程候选：当前视野（FOV）内的存活怪物，按距离升序（并列取先遇到的）
function rangedTargets(g) {
  const p = g.player;
  return g.monsters
    .filter(m => m.alive && g.visible[m.r * MAP_W + m.c])
    .sort((a, b) => dist2(a, p) - dist2(b, p));
}

// 沿玩家到目标的直线弹道（直线插值检查墙体）：
// 命中线上第一个怪物返回 true；先撞墙则返回 false（调用方尝试下一个目标）
function fireLineAt(g, target, dmg, label, onHit, elem) {
  const p = g.player;
  const dr = target.r - p.r, dc = target.c - p.c;
  const n = Math.max(Math.abs(dr), Math.abs(dc));
  const pierce = p.skills.pierce > 0;
  let hit = false, pr = p.r, pc = p.c;
  for (let i = 1; pierce || i <= n; i++) { // 穿透时飞过目标继续直到撞墙/出界
    const r = Math.round(p.r + dr * i / n);
    const c = Math.round(p.c + dc * i / n);
    if (r < 0 || r >= MAP_H || c < 0 || c >= MAP_W) break;
    if (r === pr && c === pc) continue;
    pr = r; pc = c;
    if (g.map[r * MAP_W + c] === 0) break; // 被墙阻挡
    const m = monsterAt(g, r, c);
    if (!m) continue;
    hit = true;
    say(g, `${label}${m.name}（${dmg} 点伤害）`);
    g.fx.push({ kind: 'shot', from: { r: p.r, c: p.c }, to: { r: m.r, c: m.c }, elem: elem || 'arrow' });
    damageMonster(g, m, dmg, 'ranged');
    if (m.alive && onHit) onHit(m);
    if (!pierce) break;
  }
  return hit;
}

// 自动锁定发射：按距离从近到远尝试，击中任一目标即成功
function fireAuto(g, dmg, label, onHit, elem) {
  for (const t of rangedTargets(g)) {
    if (fireLineAt(g, t, dmg, label, onHit, elem)) return true;
  }
  return false;
}

// 普通攻击（A 键，自动锁定）：近战打相邻 HP 最低怪，射手/法杖打视野内最近可达怪
function autoAttack(g) {
  if (g.status !== 'playing') return g;
  const p = g.player;
  const cls = p.weapon.class;
  if (cls === 'melee') {
    const t = meleeTarget(g);
    if (!t) {
      // 空击：朝朝向的相邻格挥空（有动画无伤害），不耗回合
      g.fx.push({ kind: 'melee', from: { r: p.r, c: p.c },
        to: { r: p.r + p.dir.dr, c: p.c + p.dir.dc } });
      say(g, '附近没有怪物');
      return g;
    }
    bumpHit(g, t);
    worldTick(g);
    return g;
  }
  const dmg = playerAttack(g);
  let fired;
  if (cls === 'archer') {
    fired = fireAuto(g, dmg, '箭矢射中了', null, 'arrow');
    if (!fired) whiffShot(g, 'arrow');
  } else {
    const form = p.form; // 法杖本次形态
    fired = fireAuto(g, dmg, form === 'fire' ? '火球击中了' : '寒冰封住了',
      m => applyElement(g, m, form), form);
    if (!fired) whiffShot(g, form);
    p.form = form === 'fire' ? 'frost' : 'fire'; // 击发（含空射）即切换形态
  }
  if (!fired) {
    say(g, '没有可攻击的目标');
    return g; // 不消耗回合
  }
  worldTick(g);
  return g;
}

// 空击弹丸：沿玩家朝向直线飞到墙/边界前的最后一格
function whiffShot(g, elem) {
  const p = g.player;
  let r = p.r, c = p.c;
  for (;;) {
    const nr = r + p.dir.dr, nc = c + p.dir.dc;
    if (nr < 0 || nr >= MAP_H || nc < 0 || nc >= MAP_W) break;
    if (g.map[nr * MAP_W + nc] === 0) break;
    r = nr; c = nc;
  }
  g.fx.push({ kind: 'shot', from: { r: p.r, c: p.c }, to: { r, c }, elem });
}

// 法杖元素效果：火焰附加灼烧，冰霜附加减速；元素强化逐层增强
function applyElement(g, m, form) {
  const emp = g.player.skills.empower;
  if (form === 'fire') {
    m.effects.burnTurns = 3;
    m.effects.burnDmg = 3 + 2 * emp;
    say(g, `${m.name}被灼烧了`);
  } else {
    m.effects.slow = 3 + emp;
    say(g, `${m.name}被减速了`);
  }
}

// 拾取（S 键）：拾取脚下道具——血包回血 / 技能书学得 / 武器换装（旧武器留在该格）
// 同格多个道具一次捡一个（技能书 > 血包 > 武器）；成功拾取消耗一回合
function pickUp(g) {
  if (g.status !== 'playing') return g;
  const p = g.player;
  const order = { skill: 0, health: 1, weapon: 2 };
  const here = g.items.filter(it => it.r === p.r && it.c === p.c)
    .sort((a, b) => order[a.kind] - order[b.kind]);
  if (here.length === 0) {
    say(g, '这里没有道具');
    return g; // 不消耗回合
  }
  const it = here[0];
  if (it.kind === 'health') {
    if (p.hp >= p.maxHp) {
      say(g, '生命已满，血包留在原地');
      return g; // 满血不消耗血包，也不耗回合
    }
    p.hp = Math.min(p.maxHp, p.hp + it.amount);
    g.items.splice(g.items.indexOf(it), 1);
    say(g, `你拾取了血包，回复 ${it.amount} 点生命`);
  } else if (it.kind === 'skill') {
    p.skills[it.skill]++;
    if (it.skill === 'tough') { p.maxHp += 10; p.hp += 10; }
    g.items.splice(g.items.indexOf(it), 1);
    say(g, `你学得了技能「${SKILL_NAMES[it.skill]}」（×${p.skills[it.skill]}）`);
  } else {
    const old = p.weapon;
    p.weapon = it.weapon;
    it.weapon = old; // 旧武器留在原地
    say(g, `你换上了${p.weapon.name}，把${old.name}留在了地上`);
  }
  worldTick(g);
  return g;
}

// 踩上楼梯下行：进入下一层并回满生命
function descend(g) {
  if (g.status !== 'playing') return g;
  const p = g.player;
  if (!g.stairs || p.r !== g.stairs.r || p.c !== g.stairs.c) return g;
  if (g.floor >= FLOORS) return g;
  generateFloor(g, g.floor + 1);
  p.hp = p.maxHp;
  say(g, '你顺着楼梯下行，状态完全恢复');
  return g;
}

// ---------- 世界节拍：DoT 结算 → 所有存活怪物行动 ----------
// 由玩家动作或浏览器层定时器（TICK_MS）驱动；终局后幂等不做事
function worldTick(g) {
  if (g.status !== 'playing') return;
  g.turns++;
  const p = g.player;
  // 1. DoT 结算（玩家中毒 + 怪物灼烧）
  if (p.poisonTurns > 0) {
    p.poisonTurns--;
    say(g, `中毒发作，你受到 ${p.poisonDmg} 点伤害`);
    damagePlayer(g, p.poisonDmg, '剧毒');
  }
  for (const m of g.monsters) {
    if (!m.alive) continue;
    if (m.effects.burnTurns > 0) {
      m.effects.burnTurns--;
      if (m.invincibleTurns <= 0) {
        say(g, `${m.name}受到 ${m.effects.burnDmg} 点灼烧伤害`);
        damageMonster(g, m, m.effects.burnDmg, 'burn');
      }
    }
  }
  if (g.status !== 'playing') { computeFov(g); return; }
  // 2. 所有存活怪物各行动一次
  for (const m of [...g.monsters]) {
    if (!m.alive) continue;
    monsterAct(g, m);
    if (g.status !== 'playing') break;
  }
  // 3. 无敌回合计数递减
  for (const m of g.monsters) if (m.invincibleTurns > 0) m.invincibleTurns--;
  computeFov(g);
}

function monsterAct(g, m) {
  const p = g.player;
  // 减速：每隔一回合才行动
  if (m.effects.slow > 0) {
    m.effects.slow--;
    m.slowPhase = !m.slowPhase;
    if (m.slowPhase) return; // 本回合跳过
  }
  // 发现玩家：距离 ≤8 或被打过
  if (!m.aware && dist2(m, p) <= FOV_RADIUS * FOV_RADIUS) m.aware = true;
  // 汪汪：发现玩家后每隔 4 回合召唤小狗，场上存活上限 4 只
  if (m.type === 'woof' && m.aware) {
    m.summonCd--;
    if (m.summonCd <= 0) {
      m.summonCd = SUMMON_EVERY;
      const puppies = g.monsters.filter(x => x.alive && x.type === 'puppy').length;
      if (puppies < MAX_PUPPIES) {
        const cell = freeNeighbor(g, m.r, m.c);
        if (cell) {
          addMonster(g, 'puppy', cell.r, cell.c).aware = true;
          say(g, '汪汪召唤了一只小狗！');
        }
      }
    }
  }
  const adjacent = Math.abs(m.r - p.r) <= 1 && Math.abs(m.c - p.c) <= 1;
  if (m.aware) {
    // 远程怪（骷髅弓手 / 复制了射手或法杖的镜像）：视线内且距离 2~7 原地射击
    if (m.ranged && !adjacent) {
      const cheb = Math.max(Math.abs(m.r - p.r), Math.abs(m.c - p.c));
      if (cheb >= m.ranged.min && cheb <= m.ranged.max && clearShot(g, m, p)) {
        let elem = 'arrow', verb = '射出了箭矢';
        if (m.type === 'mirror' && m.weapon && m.weapon.class === 'staff') {
          elem = m.form || 'fire';
          verb = '施放了法术';
          m.form = elem === 'fire' ? 'frost' : 'fire';
        }
        say(g, `${m.name}${verb}（${m.atk} 点伤害）`);
        g.fx.push({ kind: 'shot', from: { r: m.r, c: m.c }, to: { r: p.r, c: p.c }, elem });
        damagePlayer(g, m.atk, m.name);
        return;
      }
    }
    if (adjacent) { monsterAttack(g, m); return; }
    // BFS 绕障碍追击（史莱姆一回合移动 2 格）
    for (let step = 0; step < m.speed; step++) {
      if (Math.abs(m.r - p.r) <= 1 && Math.abs(m.c - p.c) <= 1) { monsterAttack(g, m); return; }
      const path = findPath(g, m.r, m.c, p.r, p.c);
      if (!path || path.length === 0) return;
      const next = path[0];
      if (monsterAt(g, next.r, next.c)) return; // 被其他怪挡住
      m.r = next.r; m.c = next.c;
    }
  } else {
    // 未发现玩家：小范围随机游荡
    if (g.rng() < 0.5) {
      const dr = Math.floor(g.rng() * 3) - 1, dc = Math.floor(g.rng() * 3) - 1;
      const nr = m.r + dr, nc = m.c + dc;
      if (nr >= 0 && nr < MAP_H && nc >= 0 && nc < MAP_W &&
          g.map[nr * MAP_W + nc] === 1 && !monsterAt(g, nr, nc) && !(nr === p.r && nc === p.c)) {
        m.r = nr; m.c = nc;
      }
    }
  }
}

function monsterAttack(g, m) {
  const p = g.player;
  say(g, `${m.name}攻击了你（${m.atk} 点伤害）`);
  g.fx.push({ kind: 'melee', from: { r: m.r, c: m.c }, to: { r: p.r, c: p.c } });
  damagePlayer(g, m.atk, m.name);
  // 骷髅攻击附加中毒 DoT
  if (m.poison && g.status === 'playing') {
    p.poisonTurns = Math.max(p.poisonTurns, m.poison.turns);
    p.poisonDmg = m.poison.dmg;
    say(g, '你中毒了！');
  }
}

// 远程怪的直线视线：仅 8 向直线（同行/同列/45° 斜线），中间无墙
function clearShot(g, m, p) {
  const dr = p.r - m.r, dc = p.c - m.c;
  if (!(dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc))) return false;
  const sr = Math.sign(dr), sc = Math.sign(dc);
  let r = m.r + sr, c = m.c + sc;
  while (r !== p.r || c !== p.c) {
    if (g.map[r * MAP_W + c] === 0) return false;
    r += sr; c += sc;
  }
  return true;
}

// 找怪物身旁一个空格（供召唤使用）
function freeNeighbor(g, r, c) {
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= MAP_H || nc < 0 || nc >= MAP_W) continue;
      if (g.map[nr * MAP_W + nc] !== 1) continue;
      if (monsterAt(g, nr, nc)) continue;
      if (g.player.r === nr && g.player.c === nc) continue;
      return { r: nr, c: nc };
    }
  }
  return null;
}

// 位图 + 调色板 → 预渲染的离屏 canvas（行宽不齐时自动居中补齐）
function makeSprite(rows, palette, scale) {
  const w = Math.max(...rows.map(r => r.length));
  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = rows.length * scale;
  const ctx = canvas.getContext('2d');
  rows.forEach((row, y) => {
    const pad = Math.floor((w - row.length) / 2);
    for (let x = 0; x < row.length; x++) {
      const color = palette[row[x]];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect((x + pad) * scale, y * scale, scale, scale);
    }
  });
  return canvas;
}

  let g, tickTimer = null;
  let anims = [], animRunning = false; // 进行中的攻击动画（消费自 g.fx）

  // 动画期间用 rAF 持续重绘；动画播完即停（场景本身无需逐帧刷新）
  function pumpAnims() {
    if (animRunning || anims.length === 0) return;
    animRunning = true;
    requestAnimationFrame(function frame() {
      draw();
      const now = performance.now();
      anims = anims.filter(a => now - a.t0 < ANIM_MS);
      if (anims.length) requestAnimationFrame(frame);
      else animRunning = false;
    });
  }

  function newGame() {
    g = createGame({ seed: (Math.random() * 2 ** 31) | 0 });
    // 世界节拍：玩家不动时，发现玩家的怪物也按节拍行动；重开先清旧定时器避免叠加
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      if (g.status !== 'playing') return;
      worldTick(g);
      draw();
    }, TICK_MS);
    draw();
  }

  function afterAction() {
    // 踩上楼梯自动下行
    if (g.status === 'playing' && g.stairs &&
        g.player.r === g.stairs.r && g.player.c === g.stairs.c) descend(g);
    draw();
  }

  // 键位：方向键 4 向移动（撞怪 = bump 攻击）；A 普通攻击；S 拾取
  const KEY_DIRS = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
  };
  document.addEventListener('keydown', e => {
    if (g.status !== 'playing') {
      if (e.code === 'Enter') newGame();
      return;
    }
    if (e.code === 'KeyA') { autoAttack(g); afterAction(); return; }
    if (e.code === 'KeyS') { pickUp(g); afterAction(); return; }
    const dir = KEY_DIRS[e.code];
    if (dir) {
      e.preventDefault();
      move(g, dir[0], dir[1]);
      afterAction();
    }
  });

  function draw() {
    const W = canvas.width, H = canvas.height;
    const p = g.player;
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
    // ---- HUD：层数 / HP / 等级 XP / 武器 / 技能 ----
    ctx.textAlign = 'left';
    ctx.font = '14px ui-monospace, monospace';
    ctx.fillStyle = '#c9d1d9';
    const nextXp = p.level <= XP_TABLE.length ? XP_TABLE[p.level - 1] : '—';
    ctx.fillText(`第 ${g.floor}/${FLOORS} 层   HP ${p.hp}/${p.maxHp}   Lv ${p.level}   XP ${p.xp}/${nextXp}`, 12, 22);
    // 站在道具上时给出拾取提示
    const under = g.items.find(it => it.r === p.r && it.c === p.c);
    if (under) {
      const desc = under.kind === 'health' ? '血包'
        : under.kind === 'skill' ? `技能书·${SKILL_NAMES[under.skill]}`
        : under.weapon.name;
      ctx.textAlign = 'right';
      ctx.fillStyle = '#e8b830';
      ctx.fillText(`脚下：${desc} — 按 S 拾取`, W - 12, 22);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#c9d1d9';
    }
    const skillText = Object.entries(p.skills).filter(([, v]) => v > 0)
      .map(([k, v]) => `${SKILL_NAMES[k]}×${v}`).join(' ') || '无';
    const formText = p.weapon.class === 'staff' ? (p.form === 'fire' ? '（火焰）' : '（冰霜）') : '';
    ctx.fillStyle = '#6b7280';
    ctx.fillText(`武器 ${p.weapon.name}${formText}   技能 ${skillText}`, 12, 44);
    // ---- 地图：探索过的地形永久常亮，未见过的不画 ----
    const oy = HUD_H;
    for (let r = 0; r < MAP_H; r++) {
      for (let c = 0; c < MAP_W; c++) {
        const i = r * MAP_W + c, x = c * CELL, y = oy + r * CELL;
        if (!g.visible[i] && !g.memory[i]) continue;
        ctx.fillStyle = g.map[i] === 0 ? '#26263a' : '#101018';
        ctx.fillRect(x, y, CELL, CELL);
      }
    }
    // 实体一律画 sprite
    const drawUnit = (spr, r, c, alpha) => {
      ctx.globalAlpha = alpha;
      ctx.drawImage(spr, c * CELL, oy + r * CELL, CELL, CELL);
      ctx.globalAlpha = 1;
    };
    // 楼梯：探索过即常亮显示
    if (g.stairs) {
      const i = g.stairs.r * MAP_W + g.stairs.c;
      if (g.visible[i] || g.memory[i]) drawUnit(SPR.stairs, g.stairs.r, g.stairs.c, 1);
    }
    // 物品：仅当前 FOV 内才画（会被捡走，记忆态不残留）
    for (const it of g.items) {
      if (!g.visible[it.r * MAP_W + it.c]) continue;
      const spr = it.kind === 'health' ? SPR.health : it.kind === 'weapon' ? SPR.weapon : SPR.book;
      drawUnit(spr, it.r, it.c, 1);
    }
    // 怪物：仅 FOV 内可见；复活当回合无敌的喵喵闪烁（半透明）
    for (const m of g.monsters) {
      if (!m.alive || !g.visible[m.r * MAP_W + m.c]) continue;
      drawUnit(SPR[m.type], m.r, m.c, m.invincibleTurns > 0 ? 0.55 : 1);
    }
    // 玩家
    drawUnit(SPR.player, p.r, p.c, 1);
    // ---- 攻击动画：消费 g.fx，近战挥砍闪光 / 远程弹丸轨迹 / 受击红闪 ----
    const now = performance.now();
    for (const e of g.fx) anims.push({ ...e, t0: now });
    g.fx.length = 0;
    const cx = c => c * CELL + CELL / 2, cy = r => oy + r * CELL + CELL / 2;
    for (const a of anims) {
      const t = Math.min(1, (now - a.t0) / ANIM_MS);
      if (a.kind === 'hit') {
        ctx.globalAlpha = 0.55 * (1 - t);
        ctx.fillStyle = '#f05050';
        ctx.fillRect(a.c * CELL, oy + a.r * CELL, CELL, CELL);
        ctx.globalAlpha = 1;
      } else if (a.kind === 'melee') {
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = '#f8f8f8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx(a.from.c), cy(a.from.r));
        ctx.lineTo(cx(a.to.c), cy(a.to.r));
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (a.kind === 'shot') {
        const x = cx(a.from.c) + (cx(a.to.c) - cx(a.from.c)) * t;
        const y = cy(a.from.r) + (cy(a.to.r) - cy(a.from.r)) * t;
        ctx.fillStyle = a.elem === 'fire' ? '#f08830' : a.elem === 'frost' ? '#22d3ee' : '#f8e858';
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    anims = anims.filter(a => now - a.t0 < ANIM_MS);
    pumpAnims();
    // ---- 消息日志：最近 4 条 ----
    ctx.textAlign = 'left';
    ctx.font = '13px ui-monospace, monospace';
    const lines = g.log.slice(-4);
    lines.forEach((msg, i) => {
      ctx.fillStyle = i === lines.length - 1 ? '#c9d1d9' : '#6b7280';
      ctx.fillText(msg, 12, oy + MAP_H * CELL + 22 + i * 18);
    });
    // ---- 死亡 / 胜利覆盖层 ----
    if (g.status !== 'playing') {
      ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = g.status === 'won' ? '#33ff66' : '#f05050';
      ctx.font = 'bold 36px ui-monospace, monospace';
      ctx.fillText(g.status === 'won' ? '通关！' : '你死了', W / 2, H / 2 - 20);
      ctx.fillStyle = '#c9d1d9';
      ctx.font = '16px ui-monospace, monospace';
      ctx.fillText(`层数 ${g.floor} · 等级 ${p.level} · 回合 ${g.turns} — 按回车重开`, W / 2, H / 2 + 20);
    }
  }
  newGame();
}
if (typeof document !== 'undefined') init();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    MAP_W, MAP_H, FLOORS, FOV_RADIUS, XP_TABLE, WEAPONS, MONSTER_TYPES, SKILL_NAMES,
    MAX_PUPPIES, SUMMON_EVERY, HEAL_AMOUNT,
    createGame, generateFloor, move, wait, autoAttack, pickUp, descend,
    worldTick,
    findPath, computeFov, addMonster, damageMonster, playerAttack, monsterAt, say,
  };
}
</script>
</body>
