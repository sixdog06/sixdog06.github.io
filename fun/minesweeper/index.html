<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sixdog — 扫雷</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
  #diff { margin-bottom: 16px; }
  #diff a { color: var(--dim); text-decoration: none; margin: 0 10px; font-size: 14px; }
  #diff a:hover { color: var(--text); }
  #diff a.active { color: var(--accent); }
  #game { max-width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="page wide">
    <div class="crumb"><a href="../index.html">~/fun</a> minesweeper</div>
    <h1 class="title">$ minesweeper</h1>
    <div style="text-align: center">
      <div id="diff">
        <a href="#" data-d="0" class="active">新手 9×9</a><a href="#" data-d="1">简单 16×16</a><a href="#" data-d="2">高手 30×16</a>
      </div>
      <canvas id="game"></canvas>
      <div class="game-desc" style="margin-top: 16px">左键翻开 · 右键插旗 · 结束后点击任意处重开（首击必安全）</div>
    </div>
  </div>
  <div class="footer">© 2026 小拳头</div>
<script>
'use strict';

// ==================== 游戏核心（纯逻辑，node 可测） ====================
function createGame({ rows, cols, mines, rng }) {
  return {
    rows, cols, mineCount: mines, rng: rng || Math.random,
    mines: null, // 首次点击时才布雷（首击保护）
    adj: new Int8Array(rows * cols),
    revealed: new Array(rows * cols).fill(false),
    flagged: new Array(rows * cols).fill(false),
    status: 'playing',
  };
}

function neighbors(g, idx) {
  const r = Math.floor(idx / g.cols), c = idx % g.cols;
  const out = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < g.rows && nc >= 0 && nc < g.cols) out.push(nr * g.cols + nc);
    }
  }
  return out;
}

function placeMines(g, safeIdx) {
  const candidates = [];
  for (let i = 0; i < g.rows * g.cols; i++) if (i !== safeIdx) candidates.push(i);
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(g.rng() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  g.mines = new Set(candidates.slice(0, g.mineCount));
  for (const m of g.mines) {
    for (const n of neighbors(g, m)) g.adj[n]++;
  }
}

function reveal(g, r, c) {
  if (g.status !== 'playing') return g;
  const idx = r * g.cols + c;
  if (g.revealed[idx] || g.flagged[idx]) return g;
  if (!g.mines) placeMines(g, idx);
  if (g.mines.has(idx)) {
    g.revealed[idx] = true;
    g.status = 'lost';
    return g;
  }
  // 泛洪：0 雷格向四周扩散，遇到数字格停下
  const stack = [idx];
  while (stack.length) {
    const i = stack.pop();
    if (g.revealed[i] || g.flagged[i] || g.mines.has(i)) continue;
    g.revealed[i] = true;
    if (g.adj[i] === 0) {
      for (const n of neighbors(g, i)) if (!g.revealed[n]) stack.push(n);
    }
  }
  // 所有非雷格都翻开即获胜
  if (g.revealed.filter(Boolean).length === g.rows * g.cols - g.mineCount) {
    g.status = 'won';
  }
  return g;
}

function toggleFlag(g, r, c) {
  if (g.status !== 'playing') return g;
  const idx = r * g.cols + c;
  if (g.revealed[idx]) return g;
  g.flagged[idx] = !g.flagged[idx];
  return g;
}

// ==================== 渲染与交互（仅浏览器，不在测试 seam 内） ====================
const HEADER_PX = 48;
const DIFFICULTIES = [
  { name: '新手', rows: 9,  cols: 9,  mines: 10, cell: 32 },
  { name: '简单', rows: 16, cols: 16, mines: 40, cell: 28 },
  { name: '高手', rows: 16, cols: 30, mines: 99, cell: 24 },
];
const NUM_COLORS = ['', '#22d3ee', '#33ff66', '#f05050', '#c792ea', '#e8b830', '#22d3ee', '#f8f8f8', '#6b7280'];

function init() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const diffLinks = document.querySelectorAll('#diff a');
  let diffIdx = 0;
  let g, cellPx, startTime = null, elapsed = 0, timer = null;

  function newGame() {
    const d = DIFFICULTIES[diffIdx];
    g = createGame({ rows: d.rows, cols: d.cols, mines: d.mines });
    cellPx = d.cell;
    canvas.width = g.cols * cellPx;
    canvas.height = HEADER_PX + g.rows * cellPx;
    startTime = null; elapsed = 0;
    clearInterval(timer); timer = null;
    draw();
  }
  diffLinks.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    diffIdx = Number(a.dataset.d);
    diffLinks.forEach(x => x.classList.toggle('active', x === a));
    newGame();
  }));
  function startTimer() {
    startTime = Date.now();
    timer = setInterval(() => { elapsed = Math.floor((Date.now() - startTime) / 1000); draw(); }, 500);
  }
  function afterMove() {
    if (g.mines && !timer) startTimer();
    if (g.status !== 'playing' && timer) { clearInterval(timer); timer = null; }
    draw();
  }
  function cellAt(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width; // CSS 缩放时换算回画布坐标
    const c = Math.floor((e.clientX - rect.left) * scale / cellPx);
    const r = Math.floor(((e.clientY - rect.top) * scale - HEADER_PX) / cellPx);
    return { r, c };
  }
  canvas.addEventListener('click', e => {
    if (g.status !== 'playing') { newGame(); return; }
    const { r, c } = cellAt(e);
    if (r < 0) { newGame(); return; } // 点顶部栏重开
    if (r >= g.rows || c >= g.cols) return;
    reveal(g, r, c);
    afterMove();
  });
  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (g.status !== 'playing') return;
    const { r, c } = cellAt(e);
    if (r < 0 || r >= g.rows || c >= g.cols) return;
    toggleFlag(g, r, c);
    afterMove();
  });

  function draw() {
    const W = canvas.width, H = canvas.height, k = cellPx / 32;
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);
    // 顶部栏：剩余雷数 / 状态 / 用时
    const flags = g.flagged.filter(Boolean).length;
    ctx.font = '16px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c9d1d9';
    const statusText = g.status === 'won' ? 'YOU WIN' : g.status === 'lost' ? 'BOOM' : 'playing';
    ctx.fillText('雷 ' + (g.mineCount - flags), 12, 30);
    ctx.textAlign = 'center';
    ctx.fillStyle = g.status === 'playing' ? '#6b7280' : g.status === 'won' ? '#33ff66' : '#f05050';
    ctx.fillText(statusText, W / 2, 30);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#c9d1d9';
    ctx.fillText(elapsed + 's', W - 12, 30);
    // 棋盘
    for (let r = 0; r < g.rows; r++) {
      for (let c = 0; c < g.cols; c++) {
        const idx = r * g.cols + c, x = c * cellPx, y = HEADER_PX + r * cellPx;
        const showMine = g.mines && g.mines.has(idx) && (g.status === 'lost' || g.revealed[idx]);
        if (g.revealed[idx] || (g.status !== 'playing' && showMine)) {
          ctx.fillStyle = showMine && g.revealed[idx] && g.status === 'lost' ? '#5a1a1a' : '#101018';
          ctx.fillRect(x, y, cellPx, cellPx);
          if (showMine) {
            ctx.fillStyle = '#f05050';
            ctx.beginPath();
            ctx.arc(x + cellPx / 2, y + cellPx / 2, 7 * k, 0, Math.PI * 2);
            ctx.fill();
          } else if (g.adj[idx] > 0) {
            ctx.fillStyle = NUM_COLORS[g.adj[idx]];
            ctx.textAlign = 'center';
            ctx.font = 'bold ' + Math.round(16 * k) + 'px ui-monospace, monospace';
            ctx.fillText(String(g.adj[idx]), x + cellPx / 2, y + cellPx / 2 + 6 * k);
          }
        } else {
          ctx.fillStyle = '#1e1e2e';
          ctx.fillRect(x + 1, y + 1, cellPx - 2, cellPx - 2);
          if (g.flagged[idx]) {
            ctx.fillStyle = '#33ff66';
            ctx.beginPath();
            ctx.moveTo(x + 10 * k, y + 8 * k);
            ctx.lineTo(x + 22 * k, y + 13 * k);
            ctx.lineTo(x + 10 * k, y + 18 * k);
            ctx.fill();
            ctx.fillRect(x + 9 * k, y + 8 * k, 2 * k, 16 * k);
          }
        }
      }
    }
  }
  newGame();
}
if (typeof document !== 'undefined') init();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { createGame, reveal, toggleFlag };
}
</script>
</body>
</html>
